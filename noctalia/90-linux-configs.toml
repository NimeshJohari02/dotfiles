# Dock pins and DDC/CI brightness support for the Acer external display.
[dock]
enabled = true
pinned = ["com.microsoft.VSCode", "zen"]
auto_hide = true
reserve_space = false
show_dots = true

[brightness]
enable_ddcutil = true

[brightness.monitor.HDMI-A-1]
backend = "ddcutil"

[shell]
polkit_agent = true

# KDE Connect integration: phone status first in the Control Center.
[weather]
enabled = false

[[control_center.shortcuts]]
type = "icefish/phone-connect:tile"

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "local/victus-fans:tile"

[[control_center.shortcuts]]
type = "power_profile"
