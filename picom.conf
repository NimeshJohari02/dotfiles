opacity-rule = [
    "80:class_g = 'URxvt'",
    "70:class_g = 'Alacritty'",
    "90:class_g = 'tabbed'",
    "70:class_g = 'Rofi'",
    "80:class_g = 'Code'",
    "80:class_g = 'XTerm'",
    "70:class_g = 'Thunar'",
    "70:class_g = 'Xfce4-terminal'",
    "80:class_g = 'CP Editor'",
    "70:class_g = 'qBittorrent'",
];

# Blur
blur:
{
    method = "dual_kawase";
    strength = 9 ;
}

wintypes:
{
    normal = { blur-background = true; };
    splash = { blur-background = false; };
};

# Fading
fading = true;
fade-in-step = 0.07;
fade-out-step = 0.07;
fade-exclude = [ ];

# Other
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
vsync = true;
dbe = false;
unredir-if-possible = true;
detect-transient = true;
detect-client-leader = true;
invert-color-include = [ ];

# GLX backend
backend = "glx";
glx-no-stencil = true;
glx-copy-from-front = false;
use-damage = true
glx-no-rebind-pixmap = true;

